name: Build Desktop

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/py/requirements.txt

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Install Python dependencies
        working-directory: desktop/py
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: desktop
        run: |
          python -m pytest -q tests
          cargo test --manifest-path src-tauri/Cargo.toml
          python scripts/smoke_test.py

      - name: Build Python sidecar
        working-directory: desktop
        run: python py/build_sidecar.py

      - name: Build Tauri app
        working-directory: desktop
        run: npm run tauri build -- --config src-tauri/tauri.prod.conf.json

      - name: Upload installation packages
        uses: actions/upload-artifact@v4
        with:
          name: english-learning-${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/**/*
